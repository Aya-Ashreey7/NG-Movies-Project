<section id="portfolio">
    <div class="container">
        <div class="row justify-content-center">

            <div class=" col-sm-12 justify-content-center">
                <div class="swiper myClients animate__animated animate__pulse">
                    <div class="swiper-wrapper h-auto">
                        @for (movie of movies; track movie.id) {
                        <div class="swiper-slide mb-5 h-auto">
                            <div class="card product-card border-0  shadow-sm w-100">
                                <div class="position-relative">
                                    <span class="badge badge-custom">New Arrival</span>
                                    <div class="overflow-hidden">
                                        <img [src]="imgUrl+movie.poster_path"
                                            class="card-img-top product-image" alt="Product Image">
                                    </div>
                                </div>
                                <div class="card-body p-2 " style="background-color: black;">
                                    <h5 class="card-title mb-3 fw-semibold"> {{movie.title}} </h5>

                                </div>
                            </div>
                        </div>
                        }
                    </div>

                    <div class="swiper-pagination"></div>
                </div>
            </div>
        </div>
    </div>
</section>

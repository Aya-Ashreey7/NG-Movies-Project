<div class="card shadow-lg w-50 p-4 mx-auto my-4" >
   

    <div class="text-center">
        <h1 class="card-title h3">Sign in below to access your account</h1>
    </div>
    <div class="mt-4">
        <form action="">
            <div class="mb-4">
                
                <input type="email" class="form-control" id="email" placeholder="Enter your Email Address" required>
            </div>
            <div class="mb-4">
                
                <input type="password" class="form-control" id="password" placeholder="Enter your Password" required>
            </div>
            
            <div class="d-grid">
                <button type="submit" class="btn btn-dark btn-lg">Sign in</button>
            </div>
            <p class="text-center text-muted mt-4">Don't have an account yet?
                <a routerLink="signup" routerLinkActive="active" class="text-decoration-none">Sign up</a>.
            </p>
        </form>
    </div>

</div>

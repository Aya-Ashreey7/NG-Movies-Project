<div class="card shadow-lg w-50 p-4 mx-auto my-4" >
   

        <div class="text-center">
            <h1 class="card-title h3">Sign up to create an account</h1>
        </div>
        <div class="mt-4">
            <form [formGroup]="registerForm" (ngSubmit)="sendData()" action="">
                <div class="mb-4">
                    
                    <input formControlName="email" type="email" class="form-control" id="email" placeholder="Enter your Email Address" required  [ngClass]="{
                        'is-valid': !registerForm.get('email')?.errors && registerForm.get('email')?.dirty,
                        'is-invalid': registerForm.get('email')?.errors && registerForm.get('email')?.dirty,
                        
                         }">
                </div>
                <div class="mb-4">
                   
                    <input formControlName="name" type="text" class="form-control" id="name" placeholder="Enter your name" required  [ngClass]="{
                        'is-valid': !registerForm.get('name')?.errors && registerForm.get('name')?.dirty,
                        'is-invalid': registerForm.get('name')?.errors && registerForm.get('name')?.dirty,
                        
                         }">
                </div>
                <div class="mb-4">
                    
                    <input formControlName="age" type="number" class="form-control" id="age" placeholder="Enter your age" required [ngClass]="{
                        'is-valid': !registerForm.get('age')?.errors && registerForm.get('age')?.dirty,
                        'is-invalid': registerForm.get('age')?.errors && registerForm.get('age')?.dirty,
                        
                         }">
                </div>
                <div class="mb-4">
                    
                    <input formControlName="password" type="password" class="form-control" id="password" placeholder="Enter your Password" required  [ngClass]="{
                        'is-valid': !registerForm.get('password')?.errors && registerForm.get('password')?.dirty,
                        'is-invalid': registerForm.get('password')?.errors && registerForm.get('password')?.dirty,
                        
                         }">
                </div>
                <p class="m-2 alert-danger">{{errorMessage}}</p>
                <div class="d-grid">
                    <button type="submit" class="btn btn-dark btn-lg">Sign up</button>
                </div>
                <p class="text-center text-muted mt-4"> Have an account ?
                    <a routerLink="signin" routerLinkActive="active" class="text-decoration-none">Sign in</a>.
                </p>
            </form>
        </div>
   
</div>
